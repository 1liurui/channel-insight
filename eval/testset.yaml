  - id: T4-23
    tier: 4
    tags: [同比, 分组]
    question: "各大区2026年8月净销额相比去年同期的增长率"
    gold_sql: |
      WITH t AS (SELECT o.region, d.year_month, SUM(s.net_amount) amt FROM fact_sales s
                 JOIN dim_date d ON s.date_key=d.date_key
                 JOIN dim_outlet o ON s.outlet_id=o.outlet_id
                 WHERE d.year_month IN ('2025-08','2026-08') GROUP BY 1,2)
      SELECT a.region, (a.amt - b.amt) / b.amt
      FROM t a JOIN t b ON a.region=b.region
      WHERE a.year_month='2026-08' AND b.year_month='2025-08'
  - id: T4-24
    tier: 4
    tags: [单店产出, 同比]
    question: "各渠道2026年8月的单店产出相比去年同期的变化"
    gold_sql: |
      WITH t AS (SELECT o.channel, d.year_month,
                        SUM(s.net_amount) / COUNT(DISTINCT s.outlet_id) spo
                 FROM fact_sales s JOIN dim_date d ON s.date_key=d.date_key
                 JOIN dim_outlet o ON s.outlet_id=o.outlet_id
                 WHERE d.year_month IN ('2025-08','2026-08') GROUP BY 1,2)
      SELECT a.channel, a.spo - b.spo
      FROM t a JOIN t b ON a.channel=b.channel
      WHERE a.year_month='2026-08' AND b.year_month='2025-08'
  - id: T4-25
    tier: 4
    tags: [费效比, 跨粒度, 对比]
    question: "2026年上半年的费效比比2025年下半年高多少"
    gold_sql: |
      WITH span AS (
        SELECT date_key,
               CASE WHEN year=2026 AND month<=6 THEN '2026H1'
                    WHEN year=2025 AND month>=7 THEN '2025H2' END AS seg
        FROM dim_date WHERE (year=2026 AND month<=6) OR (year=2025 AND month>=7)),
      s AS (SELECT sp.seg, SUM(fs.net_amount) amt FROM fact_sales fs
            JOIN span sp ON fs.date_key=sp.date_key WHERE fs.is_promo GROUP BY 1),
      c AS (SELECT sp.seg, SUM(pc.cost_amount) cost_amt FROM fact_promo_cost pc
            JOIN span sp ON pc.date_key=sp.date_key GROUP BY 1)
      SELECT (SELECT s.amt/c.cost_amt FROM s JOIN c USING (seg) WHERE seg='2026H1')
           - (SELECT s.amt/c.cost_amt FROM s JOIN c USING (seg) WHERE seg='2025H2')
