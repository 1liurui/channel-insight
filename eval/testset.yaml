    question: "华东区在2026年8月的铺市率和动销率分别是多少"
    gold_sql: |
      WITH base AS (SELECT outlet_id FROM dim_outlet WHERE is_active AND region='华东'),
      listed AS (SELECT r.outlet_id, r.sku_id FROM rel_outlet_sku r
                 WHERE r.outlet_id IN (SELECT outlet_id FROM base)),
      sold AS (SELECT DISTINCT s.outlet_id, s.sku_id FROM fact_sales s
               JOIN dim_date d ON s.date_key=d.date_key
               WHERE d.year_month='2026-08' AND s.outlet_id IN (SELECT outlet_id FROM base))
      SELECT (SELECT COUNT(DISTINCT outlet_id) FROM listed)::DOUBLE
             / (SELECT COUNT(*) FROM base) AS 铺市率,
             (SELECT COUNT(*) FROM sold)::DOUBLE
             / (SELECT COUNT(*) FROM listed) AS 动销率
