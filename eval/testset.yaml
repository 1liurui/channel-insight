    tags: [库存周转, TOPN]
    question: "2026年8月库存周转天数最长的十个经销商"
    gold_sql: |
      WITH inv AS (SELECT dealer_id, SUM(qty_on_hand) h FROM fact_inventory
                   WHERE date_key=20260831 GROUP BY dealer_id),
      so AS (SELECT s.dealer_id, SUM(s.qty)::DOUBLE / COUNT(DISTINCT s.date_key) d
             FROM fact_sales s JOIN dim_date dd ON s.date_key=dd.date_key
             WHERE dd.year_month='2026-08' GROUP BY s.dealer_id)
      SELECT dl.dealer_name, inv.h / NULLIF(so.d,0) turn_days
