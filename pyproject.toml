[project]
name = "channel-insight-agent"
version = "0.1.0"
description = "业务数据问数与归因智能体"
requires-python = ">=3.13"
dependencies = [
    # 存储
    "duckdb>=1.1.0",
    "psycopg[binary]>=3.2.0",
    "redis>=5.2.0",
    "qdrant-client>=1.12.0",
    # 检索
    "fastembed>=0.5.0",
    "bm25s>=0.2.0",
    "jieba>=0.42.1",
    "PyStemmer>=2.2.0",
    # 数据生成
    "numpy>=2.1.0",
    "pyarrow>=18.0.0",
    # 配置与工具
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "PyYAML>=6.0.2",
    "python-dotenv>=1.0.1",
    "rich>=13.9.0",
    "langgraph>=1.2.11",
    "langchain-deepseek>=1.1.0",
    "langgraph-checkpoint-postgres>=3.1.2",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "sse-starlette>=3.4.11",
    "mcp>=2.1.1",
]

[dependency-groups]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.25.0", "ruff>=0.8.0"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint.per-file-ignores]
# 脚本需先改 sys.path 才能 import app，E402 在此处是必然的
"scripts/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
